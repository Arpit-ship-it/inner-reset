[phases.setup]
nixPkgs = ['...', 'chromium', 'glib', 'nss', 'nspr', 'atk', 'cups', 'dbus', 'expat', 'fontconfig', 'freetype', 'gdk-pixbuf', 'gtk3', 'pango', 'cairo', 'xorg.libX11', 'xorg.libXcomposite', 'xorg.libXcursor', 'xorg.libXdamage', 'xorg.libXext', 'xorg.libXfixes', 'xorg.libXi', 'xorg.libXrandr', 'xorg.libXrender', 'xorg.libXss', 'xorg.libXtst', 'alsa-lib', 'mesa']

[env]
PUPPETEER_SKIP_CHROMIUM_DOWNLOAD = 'true'
PUPPETEER_EXECUTABLE_PATH = '/usr/bin/chromium'
CHROME_PATH = '/usr/bin/chromium'
